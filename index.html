<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniAgent · 学习工作台</title>
  <style>
    /* 原生 CSS：桌面并排显示，窄屏自动改为上下排列。 */
    :root { color-scheme: light; --ink: #202d29; --muted: #687770; --line: #dfe5df; --green: #275b46; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5f0; color: var(--ink); font: 15px/1.65 system-ui, sans-serif; }
    button, textarea, select { font: inherit; }
    button, select { cursor: pointer; }
    button { border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); padding: 8px 14px; }
    button:hover { background: #eef2eb; }
    button:disabled { cursor: wait; opacity: .55; }
    :focus-visible { outline: 3px solid #8abb9b; outline-offset: 3px; }
    header { height: 80px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { background: var(--green); color: white; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; font-weight: 700; }
    h1 { font-size: 19px; margin: 0; letter-spacing: -.5px; }
    .subtitle, .hint { font-size: 12px; color: var(--muted); }
    .local { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .dot { width: 7px; height: 7px; background: #62896a; border-radius: 50%; }
    main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 24px 32px; height: calc(100dvh - 80px); max-width: 1600px; margin: auto; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    h2 { font-size: 14px; margin: 0; }
    .chat { flex: 1; overflow-y: auto; padding: 24px; }
    .welcome { margin: 48px auto; max-width: 370px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .welcome h3 { font-size: 26px; line-height: 1.4; font-weight: 600; letter-spacing: -1px; margin: 12px 0; }
    .welcome p { color: var(--muted); font-size: 14px; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .examples button { font-size: 12px; }
    .message { margin-bottom: 22px; }
    .message-label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .message-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .user .message-body { background: #f0f4ed; border-radius: 10px; padding: 12px 15px; }
    .error .message-body { color: #a13b32; }
    .inspect { padding: 2px 7px; font-size: 11px; }
    .composer { padding: 16px 20px; border-top: 1px solid var(--line); background: #fcfcf9; }
    textarea { width: 100%; resize: vertical; min-height: 82px; max-height: 200px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); }
    .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .skill-label { font-size: 12px; color: var(--muted); }
    select { max-width: 220px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink); }
    .primary { background: var(--green); border-color: var(--green); color: white; min-width: 78px; }
    .primary:hover { background: #1f4938; }
    #status { min-height: 22px; margin-top: 7px; }
    .debug-title { display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 11px; background: #edf2e9; color: var(--green); padding: 2px 8px; border-radius: 5px; }
    .tabs { display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .tabs button { border: 0; padding: 6px 11px; font-size: 12px; background: transparent; }
    .tabs button[aria-selected="true"] { background: #edf2e9; color: var(--green); }
    .debug-body { overflow: auto; flex: 1; padding: 20px; }
    .empty { color: var(--muted); font-size: 13px; margin-top: 48px; text-align: center; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .metric { background: #f5f6f1; border-radius: 9px; padding: 10px 12px; font-size: 11px; color: var(--muted); }
    .metric strong { display: block; font-size: 20px; font-weight: 500; color: var(--ink); }
    .step { border-left: 2px solid #b4c8ae; padding: 0 0 14px 14px; margin-bottom: 12px; }
    .step-title { font-size: 13px; font-weight: 600; }
    details { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 9px; padding: 10px 12px; }
    summary { cursor: pointer; font-size: 12px; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.7 ui-monospace, monospace; color: #46554d; margin: 12px 0 0; }
    .state-tree { border: 0; padding: 0; }
    .state-tree summary { padding: 7px 0; font: 12px/1.7 ui-monospace, monospace; }
    .state-children { margin: 4px 0 12px 5px; padding-left: 15px; border-left: 1px solid var(--line); }
    .state-field { display: flex; flex-wrap: wrap; gap: 8px; padding: 7px 0; font: 12px/1.7 ui-monospace, monospace; overflow-wrap: anywhere; }
    .state-key { color: var(--green); }
    .state-value { white-space: pre-wrap; color: var(--muted); }
    .state-text { background: #f5f6f1; border-radius: 7px; padding: 12px; margin: 4px 0 12px; }
    .debug-footer { padding: 10px 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    @media (max-width: 850px) { header { padding: 0 16px; } main { grid-template-columns: 1fr; padding: 16px; height: auto; } .conversation { min-height: 600px; height: 75dvh; } .debug-panel { height: 600px; } .local { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">m</div><div><h1>MiniAgent</h1><div class="subtitle">从对话到工具，观察 Agent 如何工作</div></div></div>
    <div class="local"><span class="dot"></span>本地学习工作台</div>
  </header>
  <main>
    <section class="panel conversation" aria-labelledby="chat-title">
      <div class="panel-head"><h2 id="chat-title">会话</h2><button id="reset" type="button">新会话</button></div>
      <div class="chat" id="chat" aria-live="polite" aria-relevant="additions">
        <div class="welcome" id="welcome"><div class="eyebrow">LET’S BUILD, STEP BY STEP</div><h3>问一个问题，<br>看看它如何找到答案。</h3><p>在这里与自己的 Agent 对话，右侧查看计划、工具调用和送给模型的上下文。</p><div class="examples"><button type="button" data-example="比较北京和上海的天气">比较两地天气 ↗</button><button type="button" data-example="你好，你能帮我做什么？">打个招呼 ↗</button></div></div>
      </div>
      <form class="composer" id="form">
        <label class="hint" for="input">消息 · Enter 发送，Shift + Enter 换行</label>
        <textarea id="input" placeholder="输入你想交给 Agent 的任务…" required></textarea>
        <div class="composer-footer"><label class="skill-label" for="skill">Skill <select id="skill"><option value="">自动选择</option></select></label><button class="primary" id="send" type="submit">发送 ↑</button></div>
        <div class="hint" id="status" role="status">准备就绪</div>
      </form>
    </section>
    <section class="panel debug-panel" aria-labelledby="debug-title">
      <div class="panel-head"><div class="debug-title"><h2 id="debug-title">运行调试</h2><span class="badge" id="run-status">等待任务</span></div><span class="hint" id="turn-label">尚无运行记录</span></div>
      <div class="tabs" role="tablist" aria-label="调试视图">
        <button type="button" role="tab" id="tab-overview" aria-controls="debug" aria-selected="true" data-tab="overview">概览</button>
        <button type="button" role="tab" id="tab-messages" aria-controls="debug" aria-selected="false" data-tab="messages" tabindex="-1">上下文</button>
        <button type="button" role="tab" id="tab-tools" aria-controls="debug" aria-selected="false" data-tab="tools" tabindex="-1">工具</button>
        <button type="button" role="tab" id="tab-raw" aria-controls="debug" aria-selected="false" data-tab="raw" tabindex="-1">原始 State</button>
      </div>
      <div class="debug-body" id="debug" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"><p class="empty">发送一条消息后，运行信息会显示在这里。</p></div>
      <div class="debug-footer">SSE 实时状态 · 点击回答旁的「调试」回看该轮 · 新会话保留长期记忆</div>
    </section>
  </main>
  <script>
    // 页面只负责展示和请求；模型调用、工具执行与记忆仍由 Python Agent 完成。
    const $ = (id) => document.getElementById(id);
    const tabs = [...document.querySelectorAll('[data-tab]')];
    let activeTab = 'overview';
    let selectedRun = null;
    let turn = 0;
    let busy = false;

    // 用户输入和模型返回均通过 textContent 展示，不作为 HTML 执行。
    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function json(value) { return JSON.stringify(value, null, 2); }

    function detail(title, value) {
      const node = element('details');
      node.append(element('summary', title), element('pre', typeof value === 'string' ? value : json(value)));
      return node;
    }

    // 保留 State 的原始字段名；对象和数组折叠，长文本直接显示真实换行。
    function stateTree(label, value, path = label) {
      if (value !== null && typeof value === 'object') {
        const entries = Object.entries(value);
        const node = element('details', undefined, 'state-tree');
        node.dataset.path = path;
        const type = Array.isArray(value) ? '数组' : '对象';
        node.append(element('summary', `${label} · ${type} · ${entries.length} 项`));
        const children = element('div', undefined, 'state-children');
        for (const [key, child] of entries) {
          children.append(stateTree(Array.isArray(value) ? `[${key}]` : key, child, `${path}/${key}`));
        }
        node.append(children);
        return node;
      }

      const text = typeof value === 'string' ? (value || '""') : json(value);
      if (typeof value === 'string' && (value.includes('\n') || value.length > 100)) {
        const node = element('details', undefined, 'state-tree');
        node.dataset.path = path;
        node.append(element('summary', `${label} · 文本 · ${value.length} 字符`), element('pre', text, 'state-text'));
        return node;
      }
      const node = element('div', undefined, 'state-field');
      node.append(element('span', `${label}:`, 'state-key'), element('span', text, 'state-value'));
      return node;
    }

    function addMessage(role, text, run) {
      $('welcome')?.remove();
      const node = element('article', undefined, `message ${role}`);
      const label = element('div', role === 'user' ? '你' : 'MINIAGENT', 'message-label');
      if (run) {
        const button = element('button', '调试', 'inspect');
        button.type = 'button';
        button.addEventListener('click', () => { selectedRun = run; renderDebug(); });
        label.append(button);
      }
      node.append(label, element('div', text, 'message-body'));
      $('chat').append(node);
      $('chat').scrollTop = $('chat').scrollHeight;
    }

    function renderDebug() {
      const target = $('debug');
      // 实时快照更新时，保留已经展开的 State 字段和滚动位置。
      const openedPaths = new Set([...target.querySelectorAll('.state-tree[open]')].map((node) => node.dataset.path));
      const scrollTop = target.scrollTop;
      target.replaceChildren();
      const state = selectedRun?.state;
      $('turn-label').textContent = selectedRun ? `第 ${selectedRun.turn} 轮` : '尚无运行记录';
      $('run-status').textContent = selectedRun?.error ? '失败' : ({ completed: '已完成', failed: '失败', running: '执行中' }[state?.status] || '等待任务');
      if (!state) {
        target.append(element('p', selectedRun?.error || '发送一条消息后，运行信息会显示在这里。', 'empty'));
        return;
      }
      if (selectedRun.error) target.append(element('p', selectedRun.error, 'error'));
      if (activeTab === 'raw') {
        target.append(element('p', '展开字段查看原始值；长文本保留换行，数组下标从 0 开始。', 'hint'));
        const tree = stateTree('State', state);
        tree.open = true;
        target.append(tree, detail('查看完整 JSON', state));
      } else if (activeTab === 'messages') {
        target.append(element('p', '执行上下文；不包含 Skill 选择、Planner 和记忆提取的独立请求。', 'hint'));
        (state.messages || []).forEach((message, index) => {
          target.append(detail(`${String(index + 1).padStart(2, '0')} · ${message.role} · ${(message.content || '工具调用').slice(0, 60)}`, message));
        });
      } else if (activeTab === 'tools') {
        (state.tool_results || []).forEach((tool, index) => target.append(detail(`${index + 1} · ${tool.name}`, tool)));
        if (!state.tool_results?.length) target.append(element('p', '本轮没有工具调用。', 'empty'));
      } else {
        const metrics = element('div', undefined, 'metrics');
        [['循环请求', state.current_step], ['工具调用', state.tool_results?.length || 0], ['上下文消息', state.messages?.length || 0]].forEach(([label, value]) => {
          const metric = element('div', label, 'metric');
          metric.append(element('strong', String(value)));
          metrics.append(metric);
        });
        target.append(metrics, element('p', state.user_input, 'hint'));
        (state.plan?.steps || []).forEach((step) => {
          const node = element('div', undefined, 'step');
          node.append(element('div', `${step.id}. ${step.description}`, 'step-title'), element('div', step.status, 'hint'));
          if (step.result) node.append(detail('查看步骤结果', step.result));
          target.append(node);
        });
      }
      target.querySelectorAll('.state-tree').forEach((node) => {
        if (openedPaths.has(node.dataset.path)) node.open = true;
      });
      target.scrollTop = scrollTop;
    }

    function selectTab(button) {
      activeTab = button.dataset.tab;
      tabs.forEach((tab) => {
        const selected = tab === button;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      $('debug').setAttribute('aria-labelledby', button.id);
      renderDebug();
    }
    tabs.forEach((button, index) => {
      button.addEventListener('click', () => selectTab(button));
      button.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
        tabs[next].focus();
        selectTab(tabs[next]);
      });
    });

    function setBusy(value) {
      busy = value;
      ['send', 'reset', 'skill', 'input'].forEach((id) => { $(id).disabled = value; });
      $('send').textContent = value ? '执行中…' : '发送 ↑';
      $('chat').setAttribute('aria-busy', String(value));
    }

    async function request(path, payload) {
      const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await response.json();
      return { ok: response.ok, data };
    }

    async function requestChat(payload, onEvent) {
      const response = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      if (!response.ok) {
        const data = await response.json();
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      if (!response.headers.get('Content-Type')?.startsWith('text/event-stream') || !response.body) {
        throw new Error('聊天接口未返回 SSE，请重启网页服务');
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let finished = false;
      try {
        while (true) {
          const { value, done } = await reader.read();
          // 中文字节和事件都可能被分成多个网络块，先连续解码，再保留未完整的事件。
          buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
          let boundary;
          while ((boundary = /\r\n\r\n|\n\n|\r\r/.exec(buffer)) !== null) {
            const frame = buffer.slice(0, boundary.index);
            buffer = buffer.slice(boundary.index + boundary[0].length);
            let name = 'message';
            const data = [];
            for (const line of frame.split(/\r\n|\n|\r/)) {
              if (line.startsWith('event:')) name = line.slice(6).trim();
              if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
            }
            if (!data.length) continue; // 跳过 SSE 注释或心跳。
            onEvent(name, JSON.parse(data.join('\n')));
            if (name === 'done' || name === 'error') finished = true;
          }
          if (done) break;
        }
        // 正常结束必须收到明确的终止事件；断开连接不等于任务完成。
        if (!finished) throw new Error('事件流提前中断，尚未收到任务结束通知');
      } finally {
        reader.releaseLock();
      }
    }

    $('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = $('input').value.trim();
      if (!message || busy) return;
      const run = { turn: ++turn, state: null, error: null };
      addMessage('user', message);
      $('input').value = '';
      setBusy(true);
      selectedRun = run;
      renderDebug();
      $('status').textContent = '正在连接 Agent…';
      try {
        await requestChat({ message, skill_name: $('skill').value || null }, (name, data) => {
          if (name === 'state') {
            run.state = data;
            $('status').textContent = data.status === 'completed' ? '任务已完成，正在结束响应…'
              : data.status === 'failed' ? '任务失败，正在结束响应…'
              : data.current_plan_step_id != null ? `正在执行第 ${data.current_plan_step_id} 步…`
              : data.plan ? '计划已生成，准备执行…' : '任务已开始，正在选择技能和生成计划…';
          } else if (name === 'done') {
            run.state = data.state;
            addMessage(data.state?.status === 'failed' ? 'error' : 'assistant', data.answer, run);
            $('status').textContent = data.state?.status === 'failed' ? '任务未完成' : '本轮结束';
          } else if (name === 'error') {
            run.state = data.state;
            run.error = data.error || '执行失败';
            addMessage('error', run.error, run);
            $('status').textContent = '执行失败，可以在调试面板查看已产生的状态。';
          }
          // 查看旧轮次时，新事件仍保存到本轮，但不抢走右侧正在查看的内容。
          if (selectedRun === run) renderDebug();
        });
      } catch (error) {
        run.error = error.message;
        addMessage('error', run.error, run);
        $('status').textContent = '请求失败';
      } finally {
        if (selectedRun === run) renderDebug();
        setBusy(false);
        $('input').focus();
      }
    });

    $('input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        $('form').requestSubmit();
      }
    });
    document.querySelectorAll('[data-example]').forEach((button) => button.addEventListener('click', () => {
      if (busy) return;
      $('input').value = button.dataset.example;
      $('input').focus();
    }));

    $('reset').addEventListener('click', async () => {
      if (busy) return;
      setBusy(true);
      try {
        const { ok, data } = await request('/api/reset', {});
        if (!ok) throw new Error(data.error);
        $('chat').replaceChildren(element('p', '新会话已开始，长期记忆仍保留。', 'hint'));
        selectedRun = null;
        turn = 0;
        renderDebug();
        $('status').textContent = '准备就绪';
      } catch (error) {
        $('status').textContent = `新会话创建失败：${error.message}`;
      } finally {
        setBusy(false);
        $('input').focus();
      }
    });

    // 只读取名称和简介；Skill 正文由后端按需加载。
    fetch('/api/skills').then((response) => {
      if (!response.ok) throw new Error('无法读取 Skill 目录');
      return response.json();
    }).then((data) => {
      data.skills.forEach((skill) => {
        const option = element('option', skill.name);
        option.value = skill.name;
        option.title = skill.description;
        $('skill').append(option);
      });
    }).catch((error) => { $('status').textContent = error.message; });
  </script>
</body>
</html>
